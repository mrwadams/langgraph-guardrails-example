[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-guardrails"
version = "0.1.0"
description = "Comprehensive guardrails implementation for LangGraph workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["langgraph", "guardrails", "ai", "safety", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.0.20",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.0.5"]
anthropic = ["langchain-anthropic>=0.1.0"]
pii = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0"]
toxicity = ["detoxify>=0.5.0"]
language = ["langdetect>=1.0.9"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]
all = [
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "detoxify>=0.5.0",
    "langdetect>=1.0.9",
]

[project.urls]
Homepage = "https://github.com/yourusername/langgraph-guardrails-example"
Documentation = "https://github.com/yourusername/langgraph-guardrails-example#readme"
Repository = "https://github.com/yourusername/langgraph-guardrails-example"
Issues = "https://github.com/yourusername/langgraph-guardrails-example/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
